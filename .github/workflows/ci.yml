name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            packages/rail-py/pyproject.toml
            packages/mcp-server/pyproject.toml
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e 'packages/rail-py[local]' -e packages/mcp-server
          pip install pytest jsonschema
      - name: Run package tests
        run: |
          PYTHONPATH=packages/rail-py:packages/mcp-server pytest -q \
            packages/rail-py/tests/test_bootstrap.py \
            packages/rail-py/tests/test_markdown_graph.py \
            packages/rail-py/tests/test_cli.py \
            packages/rail-py/tests/test_issue_intake.py \
            packages/rail-py/tests/test_source_dependencies.py \
            packages/rail-py/tests/test_think.py \
            packages/rail-py/tests/test_workflows.py \
            packages/rail-py/tests/test_provider_v1.py \
            packages/rail-py/tests/test_capability_publication.py \
            packages/rail-py/tests/test_opensaddle_v1_projection.py \
            packages/rail-py/tests/test_wire_contract_resources.py \
            packages/rail-py/tests/test_management_v1.py \
            packages/rail-py/tests/test_krail_admin_adapter.py \
            packages/rail-py/tests/test_krail_mutation_adapter.py \
            packages/mcp-server/tests/test_server.py::test_mcp_graph_entities_calls_project \
            packages/mcp-server/tests/test_server.py::test_mcp_vector_search_calls_project \
            packages/mcp-server/tests/test_server.py::test_mcp_sources_affected_passes_source_ids \
            packages/mcp-server/tests/test_server.py::test_mcp_sources_check_calls_project
      - name: Fresh example smoke
        run: |
          krail --version
          krail --local --path examples/minimal-project doctor
          krail --local --path examples/minimal-project sources validate
          krail --local --path examples/minimal-project sources check
          krail --local --path examples/minimal-project sources affected
          krail --local --path examples/minimal-project graph build
          krail --local --path examples/minimal-project graph check
          krail --local --path examples/minimal-project vector build
          krail --local --path examples/minimal-project search "employment index" --rag --explain
          rail-mcp --help >/dev/null
      - name: Trust lifecycle smoke
        if: matrix.python-version == '3.11'
        run: bash scripts/trust-lifecycle-smoke.sh
      - name: Nested-project smoke
        if: matrix.python-version == '3.11'
        run: bash scripts/nested-project-smoke.sh
      - name: Build and check distributions
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install --upgrade build twine
          rm -rf packages/rail-py/dist packages/mcp-server/dist
          python -m build packages/rail-py
          python -m build packages/mcp-server
          python -m twine check packages/rail-py/dist/* packages/mcp-server/dist/*
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("packages/rail-py/dist").glob("krail-*.whl"))
          required = {
              "krail/admin.py", "krail/mutation.py", "krail/management/v1.py",
              "krail/management/stdio.py",
              "krail/resources/contracts/krail.context-brief.v1/bundle.json",
          }
          with zipfile.ZipFile(wheel) as archive:
              missing = sorted(required - set(archive.namelist()))
          if missing:
              raise SystemExit(f"wheel is missing release files: {missing}")
          print(f"verified packaged adapters in {wheel.name}")
          PY
