name: Release Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            packages/rail-py/pyproject.toml
            packages/mcp-server/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'packages/rail-py[local]' -e packages/mcp-server
          python -m pip install pytest jsonschema

      - name: Run release tests
        run: |
          PYTHONPATH=packages/rail-py:packages/mcp-server pytest -q \
            packages/rail-py/tests/test_bootstrap.py \
            packages/rail-py/tests/test_markdown_graph.py \
            packages/rail-py/tests/test_cli.py \
            packages/rail-py/tests/test_issue_intake.py \
            packages/rail-py/tests/test_source_dependencies.py \
            packages/rail-py/tests/test_think.py \
            packages/rail-py/tests/test_workflows.py \
            packages/rail-py/tests/test_provider_v1.py \
            packages/rail-py/tests/test_capability_publication.py \
            packages/rail-py/tests/test_opensaddle_v1_projection.py \
            packages/rail-py/tests/test_wire_contract_resources.py \
            packages/rail-py/tests/test_management_v1.py \
            packages/rail-py/tests/test_krail_admin_adapter.py \
            packages/rail-py/tests/test_krail_mutation_adapter.py \
            packages/mcp-server/tests/test_server.py::test_mcp_graph_entities_calls_project \
            packages/mcp-server/tests/test_server.py::test_mcp_vector_search_calls_project \
            packages/mcp-server/tests/test_server.py::test_mcp_sources_affected_passes_source_ids \
            packages/mcp-server/tests/test_server.py::test_mcp_sources_check_calls_project

      - name: Fresh example smoke
        run: |
          krail --version
          krail --local --path examples/minimal-project doctor
          krail --local --path examples/minimal-project sources validate
          krail --local --path examples/minimal-project sources check
          krail --local --path examples/minimal-project sources affected
          krail --local --path examples/minimal-project graph build
          krail --local --path examples/minimal-project graph check
          krail --local --path examples/minimal-project vector build
          krail --local --path examples/minimal-project search "employment index" --rag --explain
          rail-mcp --help >/dev/null

      - name: Trust lifecycle smoke
        if: matrix.python-version == '3.11'
        run: bash scripts/trust-lifecycle-smoke.sh

      - name: Nested-project smoke
        if: matrix.python-version == '3.11'
        run: bash scripts/nested-project-smoke.sh

  build-distributions:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          versions = {
              tomllib.loads(Path(path).read_text())["project"]["version"]
              for path in ("packages/rail-py/pyproject.toml", "packages/mcp-server/pyproject.toml")
          }
          if len(versions) != 1:
              raise SystemExit(f"package versions disagree: {sorted(versions)}")
          version = versions.pop()
          ref = os.environ.get("GITHUB_REF_NAME", "")
          if os.environ.get("GITHUB_REF_TYPE") == "tag" and ref != f"v{version}":
              raise SystemExit(f"release tag {ref!r} does not match package version v{version}")
          print(f"release version aligned: {version}")
          PY
          rm -rf packages/rail-py/dist packages/mcp-server/dist
          python -m build packages/rail-py
          python -m build packages/mcp-server
          python -m twine check packages/rail-py/dist/* packages/mcp-server/dist/*

      - name: Fresh wheel install smoke
        run: |
          python -m venv .venv-release
          . .venv-release/bin/activate
          python -m pip install --upgrade pip
          pip install packages/rail-py/dist/*.whl
          krail --version
          krail --local --path examples/minimal-project integrity status
          krail docs query knowledge-operations
          krail-admin --help >/dev/null
          krail-mutate --help >/dev/null
          pip install --find-links packages/rail-py/dist packages/mcp-server/dist/*.whl
          rail-mcp --help >/dev/null

      - name: Inspect wheel contents and entrypoints
        run: |
          . .venv-release/bin/activate
          python - <<'PY'
          from importlib.metadata import distribution

          expected = {
              "krail/admin.py",
              "krail/mutation.py",
              "krail/management/v1.py",
              "krail/management/stdio.py",
              "krail/resources/contracts/krail.context-brief.v1/bundle.json",
              "krail/resources/contracts/krail.provider.v1/manifest.json",
          }
          dist = distribution("krail")
          files = {str(item) for item in dist.files or ()}
          missing = sorted(expected - files)
          if missing:
              raise SystemExit(f"krail wheel is missing release files: {missing}")
          scripts = {
              entry.name for entry in dist.entry_points if entry.group == "console_scripts"
          }
          required_scripts = {"krail", "rail", "krail-managed", "krail-admin", "krail-mutate"}
          if not required_scripts <= scripts:
              raise SystemExit(f"krail wheel is missing entrypoints: {sorted(required_scripts - scripts)}")
          if dist.version != "1.1.13":
              raise SystemExit(f"unexpected KRAIL release version: {dist.version}")
          print("KRAIL wheel contents and entrypoints verified")
          PY

      - name: Upload krail distributions
        uses: actions/upload-artifact@v4
        with:
          name: krail-dist
          path: packages/rail-py/dist/*

      - name: Upload rail-mcp distributions
        uses: actions/upload-artifact@v4
        with:
          name: rail-mcp-dist
          path: packages/mcp-server/dist/*

  publish-krail:
    needs: build-distributions
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download krail distributions
        uses: actions/download-artifact@v4
        with:
          name: krail-dist
          path: packages/rail-py/dist

      - name: Publish krail to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/rail-py/dist

  publish-rail-mcp:
    needs: publish-krail
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download rail-mcp distributions
        uses: actions/download-artifact@v4
        with:
          name: rail-mcp-dist
          path: packages/mcp-server/dist

      - name: Publish rail-mcp to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/mcp-server/dist
