documents:
  - path: topics/billing-ownership.md
    depends_on:
      - id: local:billing-service-export
        type: local_file
        path: fixtures/service-repository.json
        role: initial_service_ownership
        refresh: manual
      - id: local:billing-ownership-ticket
        type: local_file
        path: fixtures/ownership-change-ticket.json
        role: reviewed_ownership_change
        refresh: manual
  - path: topics/brief.md
    depends_on:
      - id: local:research-question
        type: local_file
        path: specs/research_question.yaml
        role: project_spec
        refresh: manual
  - path: topics/company_overview.md
    depends_on:
      - id: local:brief
        type: local_file
        path: topics/brief.md
        role: company_context
        refresh: manual
      - id: source:product-roadmap
        type: synthetic
        path: research_plan/source_registry.md
        role: roadmap
        refresh: weekly
  - path: topics/revops_stack.md
    depends_on:
      - id: local:brief
        type: local_file
        path: topics/brief.md
        role: company_context
        refresh: manual
      - id: source:revops-metrics
        type: synthetic
        path: research_plan/source_registry.md
        role: operating_metric
        refresh: weekly
